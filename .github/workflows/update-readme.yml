name: Update README Date

on:
  schedule:
    # Run daily at 12:00 AM IST
    - cron: '30 18 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README date
        run: |
          python3 <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          readme = Path("README.md")

          if not readme.exists():
              raise SystemExit("README.md not found!")

          content = readme.read_text(encoding="utf-8")

          start = "<!-- DAILY_DATE_START -->"
          end = "<!-- DAILY_DATE_END -->"

          if start not in content or end not in content:
              raise SystemExit("Date markers not found in README.md!")

          if content.index(start) >= content.index(end):
              raise SystemExit("Date markers are in the wrong order!")

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%d %B %Y")

          updated_section = (
              f"{start}\n"
              f"Last Updated: {today}\n"
              f"{end}"
          )

          before, remainder = content.split(start, 1)
          _, after = remainder.split(end, 1)

          updated_content = before + updated_section + after

          readme.write_text(updated_content, encoding="utf-8")

          print(f"README date updated to: {today}")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README date is already up to date."
          else
            git commit -m "chore: update README date"
            git push
          fi
